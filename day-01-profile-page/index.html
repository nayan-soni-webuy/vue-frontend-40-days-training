<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Profile | My Account</title>
  
  <!-- css file -->
   <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- this is main content -->
  <main>
    
    <!--navigation usig breadcrumb and order list -->
    <nav class="breadcrumb" aria-label="breadcrumb">
      <ol>
        <li><a href="/">Home</a></li>
        <li aria-current="page">My Account</li>
      </ol>
    </nav>

    <!-- h1 aur cards ko ek wrapper kia, taki css se width... margin ik jagah set ho -->
    <div class="profile">

      <h1>Your Profile</h1>

      <!-- 1. profile info -->
      <section class="card" aria-labelledby="personal-info-title">
        <div class="card-head">
          <h2 id="personal-info-title">Personal Info</h2>
          <button type="button" class="btn" aria-label="edit personal info">Edit</button>
        </div> 

        <dl class="info-grid">
          <div>
            <dt>First Name</dt>
            <dd>Nayan</dd>
          </div>
          <div>
            <dt>Last Name</dt>
            <dd>Soni</dd>
          </div>
        </dl>
      </section>

      <!-- 2. email address -->
      <section class="card" aria-labelledby="email-title">
        <div class="card-head">
          <h2 id="email-title">Email Address</h2>
          <button type="button" class="btn" aria-label="edit email address">Edit</button>
        </div> 

        <dl class="info-grid one-col">
          <div>
            <dt>Email Address</dt>
            <dd>nayansoni@yahoo.com</dd>
          </div>
        </dl>
      </section>

      <!-- 3. profile info -->
      <section class="card" aria-labelledby="contact-title">
        <div class="card-head">
          <h2 id="contact-title">Contact Nomber</h2>
          <button type="button" class="btn" aria-label="add contact number">Add</button>
        </div> 
      </section>

      <!-- 4. password info -->
      <section class="card" aria-labelledby="password-title">
        <h2 id="password-title">Passwrod</h2>

        <!-- abi k lie link -->
        <a href="/resent-password" class="reset-link">Reset password</a>
      </section>

      <!-- 5. profile info -->
      <section class="card" aria-labelledby="marketing-title">
        <div class="card-head">
          <h2 id="marketing-title">Marketing Preferences</h2>
          <button type="button" class="btn" aria-label="edit marketing preferences">Edit</button>
        </div> 

        <ul class="pref-list">
          <li>
            Keep me upto date via email.
          </li>
          <li>
            keep me upto date via sms.
          </li>
        </ul>
      </section>

    </div>

  </main>
  
</body>
</html>
